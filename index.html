<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D & A — Controlo do Protocolo</title>
  
  <style>
    :root {
      --bg-color: #FAF8F5;          
      --card-bg: #FFFFFF;           
      --primary-gold: #C5A059;      
      --dark-gold: #9E7D3B;         
      --light-gold: #F4EAD2;        
      --text-color: #333333;        
      --text-muted: #777777;        
      --danger-red: #D9534F;        
      --border-radius: 12px;
      --box-shadow: 0 4px 15px rgba(197, 160, 89, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px 15px;
      max-width: 650px;
      margin: 0 auto;
    }

    #pinOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(250, 248, 245, 0.96);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }

    .pin-card {
      background: var(--card-bg);
      border: 2px solid var(--primary-gold);
      padding: 30px 20px;
      border-radius: var(--border-radius);
      box-shadow: var(--box-shadow);
      text-align: center;
      width: 100%;
      max-width: 350px;
    }

    .pin-card h2 {
      color: var(--dark-gold);
      margin-bottom: 8px;
    }

    .pin-card input {
      width: 100%;
      padding: 12px;
      font-size: 1.2rem;
      text-align: center;
      letter-spacing: 5px;
      border: 1px solid var(--primary-gold);
      border-radius: 8px;
      margin: 15px 0;
      outline: none;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      color: var(--dark-gold);
      font-size: 1.8rem;
      letter-spacing: 1px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 18px;
      margin-bottom: 20px;
      box-shadow: var(--box-shadow);
      border: 1px solid rgba(197, 160, 89, 0.2);
    }

    .card h3 {
      color: var(--dark-gold);
      margin-bottom: 12px;
      font-size: 1.1rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 2fr 1.5fr 1fr auto;
      gap: 10px;
    }

    @media (max-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #E0D6C3;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      background-color: #FAF8F5;
    }

    input:focus, select:focus {
      border-color: var(--primary-gold);
      background-color: #FFFFFF;
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--primary-gold), var(--dark-gold));
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-gold:active {
      opacity: 0.85;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--primary-gold);
      background: var(--primary-gold);
      color: white;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .mesa-container {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 15px;
      margin-bottom: 15px;
      border-left: 5px solid var(--primary-gold);
      box-shadow: var(--box-shadow);
    }

    .mesa-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--light-gold);
      padding-bottom: 8px;
    }

    .mesa-title {
      font-weight: bold;
      color: var(--dark-gold);
      font-size: 1.1rem;
    }

    .convidado-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px dashed #EEE;
      gap: 10px;
    }

    .convidado-item:last-child {
      border-bottom: none;
    }

    .convidado-info {
      flex: 1;
    }

    .convidado-info strong {
      display: block;
      color: var(--text-color);
      font-size: 0.95rem;
    }

    .convidado-info span {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .convidado-acoes {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .select-mesa {
      padding: 5px 8px;
      font-size: 0.8rem;
      max-width: 110px;
    }

    .badge-status {
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      border: none;
    }

    .status-nao {
      background-color: #F8D7DA;
      color: #721C24;
    }

    .status-confirmado {
      background-color: #D4EDDA;
      color: #155724;
    }

    .btn-action {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 2px 4px;
    }
  </style>
</head>

        <button type="submit" class="btn-gold" style="width: 100%;">Entrar</button>
      </form>
    </div>
  </div>

    function validarPIN(e) {
      if(e) e.preventDefault();
      const input = document.getElementById('pinInput').value.trim();
      const pinCorreto = "0009";

      if (input === pinCorreto) {
        sessionStorage.setItem('protocolo_autenticado', 'true');
        document.getElementById('pinOverlay').style.setProperty('display', 'none', 'important');
      } else {
        alert('PIN incorreto! Tente novamente.');
        document.getElementById('pinInput').value = '';
      }
    }

    if (sessionStorage.getItem('protocolo_autenticado') === 'true') {
      document.getElementById('pinOverlay').style.display = 'none';
    }

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const dbRef = firebase.database().ref('dadosMesas');

    let dadosMesas = [];

    // Lê a nuvem e, se estiver limpa/vazia, popula automaticamente com o array interno de 21 mesas
    dbRef.on('value', (snapshot) => {
      const dataFirebase = snapshot.val();

      if (!dataFirebase || (Array.isArray(dataFirebase) && dataFirebase.length === 0)) {
        dadosMesas = dadosMesasIniciais;
        dbRef.set(dadosMesasIniciais);
      } else if (Array.isArray(dataFirebase)) {
        dadosMesas = dataFirebase;
      } else {
        dadosMesas = Object.values(dataFirebase).length > 0 ? Object.values(dataFirebase) : dadosMesasIniciais;
      }
      filtrarDados();
    });

    function salvarNoFirebase() {
      dbRef.set(dadosMesas);
    }

    }

    function mostrarTodasMesas() {
      document.getElementById('searchInput').value = '';
      filtrarDados();
    }

    function alternarStatus(id) {
      dadosMesas.forEach(m => {
        const convidado = m.convidados.find(c => c.id === id);
        if (convidado) {
          convidado.acomodado = !convidado.acomodado;
        }
      });
      salvarNoFirebase();
    }

    function editarConvidado(mesaNome, idConvidado) {
      let grupo = dadosMesas.find(m => m.mesa === mesaNome);
      if (!grupo) return;
      let convidado = grupo.convidados.find(c => c.id === idConvidado);
      if (!convidado) return;

      let novoNome = prompt("Editar Nome do Convidado:", convidado.nome);
      if (novoNome === null) return;

      let novosAcomp = prompt("Editar Acompanhantes:", convidado.acompanhantes);
      if (novosAcomp === null) return;

      convidado.nome = novoNome.trim() || convidado.nome;
      convidado.acompanhantes = novosAcomp.trim() || "-";

      salvarNoFirebase();
    }

    function mudarMesa(idConvidado, novaMesaNome) {
      let convidadoEncontrado = null;

      dadosMesas.forEach(grupo => {
        const index = grupo.convidados.findIndex(c => c.id === idConvidado);
        if (index !== -1) {
          convidadoEncontrado = grupo.convidados.splice(index, 1)[0];
        }
      });

      dadosMesas = dadosMesas.filter(m => m.convidados.length > 0);

      if (convidadoEncontrado) {
        let mesaDestino = dadosMesas.find(m => m.mesa === novaMesaNome);
        if (!mesaDestino) {
          mesaDestino = { mesa: novaMesaNome, convidados: [] };
          dadosMesas.push(mesaDestino);
        }
        mesaDestino.convidados.push(convidadoEncontrado);
      }

      salvarNoFirebase();
    }

    function adicionarConvidado(e) {
      e.preventDefault();

      const nome = document.getElementById('novoNome').value.trim();
      const acompanhantes = document.getElementById('novosAcompanhantes').value.trim() || "-";
      const nomeMesa = document.getElementById('novaMesa').value.trim();

      if (!nome || !nomeMesa) return;

      const novoConvidado = {
        id: Date.now(),
        nome: nome,
        acompanhantes: acompanhantes,
        acomodado: false
      };

      let grupoMesa = dadosMesas.find(m => m.mesa.toLowerCase() === nomeMesa.toLowerCase());

      if (grupoMesa) {
        grupoMesa.convidados.push(novoConvidado);
      } else {
        dadosMesas.push({
          mesa: nomeMesa,
          convidados: [novoConvidado]
        });
      }

      document.getElementById('addForm').reset();
      salvarNoFirebase();
    }

    function removerConvidado(mesaNome, convidadoId) {
      const mesa = dadosMesas.find(m => m.mesa === mesaNome);
      if (mesa) {
        mesa.convidados = mesa.convidados.filter(c => c.id !== convidadoId);
        if (mesa.convidados.length === 0) {
          dadosMesas = dadosMesas.filter(m => m.mesa !== mesaNome);
        }
        salvarNoFirebase();
      }
    }

    function limparPesquisa() {
      document.getElementById('searchInput').value = '';
      filtrarDados();
    }

    function filtrarDados() {
      const termo = document.getElementById('searchInput').value.toLowerCase();
      const container = document.getElementById('listaConteudo');
      container.innerHTML = '';
      const listaMesas = obterTodasMesas();

      dadosMesas.forEach(grupoMesa => {
        const convidadosFiltrados = grupoMesa.convidados.filter(c => {
          if (!termo) return true;
          const correspondeNome = c.nome.toLowerCase().includes(termo);
          const correspondeMesa = grupoMesa.mesa.toLowerCase().includes(termo);
          return correspondeNome || correspondeMesa;
        });

        if (convidadosFiltrados.length > 0) {
          const totalConfirmados = convidadosFiltrados.filter(c => c.acomodado).length;

          let mesaHTML = `
            <div class="mesa-container">
              <div class="mesa-header">
                <span class="mesa-title">${grupoMesa.mesa}</span>
                <span style="font-size: 0.85rem; color: var(--text-muted);">${totalConfirmados}/${convidadosFiltrados.length} confirmados</span>
              </div>
          `;

          convidadosFiltrados.forEach(c => {
            let opcoesMesa = listaMesas.map(m => 
              `<option value="${m}" ${m === grupoMesa.mesa ? 'selected' : ''}>${m}</option>`
            ).join('');

            let mesaNomeSegura = grupoMesa.mesa.replace(/'/g, "\\'");

            mesaHTML += `
              <div class="convidado-item">
                <div class="convidado-info">
                  <strong>${c.nome}</strong>
                  <span>${c.acompanhantes}</span>
                </div>
                <div class="convidado-acoes">
                  <select class="select-mesa" onchange="mudarMesa(${c.id}, this.value)">
                    ${opcoesMesa}
                  </select>
                  <button onclick="alternarStatus(${c.id})" class="badge-status ${c.acomodado ? 'status-confirmado' : 'status-nao'}">
                    ${c.acomodado ? '✓ Confirmado' : 'Não Confirmado'}
                  </button>
                  <button onclick="editarConvidado('${mesaNomeSegura}', ${c.id})" class="btn-action" title="Editar Convidado">✏️</button>
                  <button onclick="removerConvidado('${mesaNomeSegura}', ${c.id})" class="btn-action" style="color: var(--danger-red);" title="Apagar Convidado">🗑️</button>
                </div>
              </div>
            `;
          });

          mesaHTML += `</div>`;
          container.innerHTML += mesaHTML;
        }
      });

      if (container.innerHTML === '') {
        container.innerHTML = `<p style="text-align: center; color: var(--text-muted); margin-top: 20px;">Nenhum convidado ou mesa encontrada.</p>`;
      }
    }
  </script>
</body>
</html>
